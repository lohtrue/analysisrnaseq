repository_type: pipeline

nf_core_version: 4.1.0

lint:
  files_unchanged:
    - .prettierignore
    - CODE_OF_CONDUCT.md
    - assets/nf-core-analysisrnaseq_logo_light.png
    - docs/images/nf-core-analysisrnaseq_logo_light.png
    - docs/images/nf-core-analysisrnaseq_logo_dark.png
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/PULL_REQUEST_TEMPLATE.md
    - assets/email_template.txt
    - docs/README.md
    - docs/CONTRIBUTING.md
  nextflow_config:
    - process.cpus
    - process.memory
    - process.time
    - custom_config
    - params.custom_config_version
    - params.custom_config_base
    - manifest.name
    - manifest.homePage
  multiqc_config:
    - report_comment
  files_exist:
    - conf/igenomes.config
    - conf/igenomes_ignored.config
    - conf/igenomes.config
    - assets/email_template.html
    - assets/sendmail_template.txt
    - assets/email_template.txt
    - CODE_OF_CONDUCT.md
    - assets/nf-core-analysisrnaseq_logo_light.png
    - docs/images/nf-core-analysisrnaseq_logo_light.png
    - docs/images/nf-core-analysisrnaseq_logo_dark.png
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/workflows/awstest.yml
    - .github/workflows/awsfulltest.yml
  readme:
    - nextflow_badge
    - nfcore_template_badge
  included_configs: false

template:
  org: lohtrue
  name: analysisrnaseq
  description: A nextflow pipeline for quality control, alignment and further processing
    of RNA-seq data.
  author: Hanna Lohmann, Pia Truebenbach
  version: 1.0.0dev
  force: true
  outdir: .
  skip_features:
    - github_badges
    - igenomes
    - nf_core_configs
    - seqera_platform
    - gpu
    - codespaces
    - email
  is_nfcore: false
